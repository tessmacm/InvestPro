name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps --include=dev

      - name: Build Web Application (Mobile)
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: npm run build:mobile

      - name: Sync Capacitor iOS
        run: npm run cap:sync:ios

      - name: Build iOS App (Simulator / Unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath ios/App/DerivedData COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Compress iOS App Bundle
        run: |
          mkdir -p ios-build
          cd ios/App/DerivedData/Build/Products/Debug-iphonesimulator
          zip -r ../../../../../../ios-build/InvestPro-iOS-Simulator.zip App.app

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: investpro-ios-simulator-app
          path: ios-build/InvestPro-iOS-Simulator.zip
