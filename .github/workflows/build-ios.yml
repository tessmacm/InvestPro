name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  CI: false

jobs:
  build-ios:
    name: Build iOS Application
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm install

      - name: Build Web Application (Mobile)
        env:
          GEMINI_API_KEY: ''
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: npx --yes vite build

      - name: Copy Built Web Assets to iOS Native Folder
        run: |
          mkdir -p ios/App/App/public
          cp -r dist/* ios/App/App/public/
          cp capacitor.config.json ios/App/App/

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj

      - name: Build iOS App (Simulator / Unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath ios/App/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Compress iOS App Bundle
        run: |
          cd ios/App/DerivedData/Build/Products/Debug-iphonesimulator
          zip -r InvestPro-iOS-Debug.app.zip App.app

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: investpro-ios-debug-app
          path: ios/App/DerivedData/Build/Products/Debug-iphonesimulator/InvestPro-iOS-Debug.app.zip
          retention-days: 14
