name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  CI: true

jobs:
  build-ios:
    name: Build iOS Application
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application (Mobile)
        env:
          GEMINI_API_KEY: ''
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: npm run build:mobile

      - name: Sync Capacitor iOS Assets
        run: |
          npx --yes cap copy ios || npx --yes cap sync ios

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj

      - name: Build iOS App (Simulator / Unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath ios/App/DerivedData CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build

      - name: Compress iOS App Bundle
        run: |
          cd ios/App/DerivedData/Build/Products/Debug-iphonesimulator
          zip -r InvestPro-iOS-Debug.app.zip App.app

      - name: Upload iOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: investpro-ios-debug-app
          path: ios/App/DerivedData/Build/Products/Debug-iphonesimulator/InvestPro-iOS-Debug.app.zip
          retention-days: 14
