name: Build Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps --include=dev

      - name: Build Web Application (Mobile)
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          VITE_API_URL: 'https://investpro-api-eah3gdgnc2dmf9ah.canadacentral-01.azurewebsites.net'
        run: npm run build:mobile

      - name: Setup Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Fix Gradle Wrapper Line Endings, Permissions and Re-download JAR
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew
          curl -fsSL "https://services.gradle.org/distributions/gradle-8.14.3-wrapper.jar.sha256" || true
          curl -fsSL "https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradle/wrapper/gradle-wrapper.jar" \
            -o android/gradle/wrapper/gradle-wrapper.jar
          echo "JAR size: $(wc -c < android/gradle/wrapper/gradle-wrapper.jar) bytes"

      - name: Sync Capacitor Android
        run: npm run cap:sync:android

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: investpro-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
